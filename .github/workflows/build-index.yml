# After every merge to main: regenerate index.json (what AZRA's Community tab downloads) and
# commit it if it changed. Part PRs never touch index.json themselves, so concurrent submissions
# never conflict.
name: Build index

on:
  push:
    branches: [main]
    paths: ['parts/**', 'scripts/build_index.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index.json
        run: python3 scripts/build_index.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.json; then echo "index.json unchanged"; exit 0; fi
          git config user.name "azra-parts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "index: rebuild ($(python3 -c 'import json;print(len(json.load(open("index.json"))["parts"]))') parts)"
          git push
